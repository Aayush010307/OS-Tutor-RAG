<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="OS-Tutor: a course-grounded tutor for threads and synchronization." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>OS-Tutor</title>
    <script>
      try { var t = localStorage.getItem("os-tutor:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
